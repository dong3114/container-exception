# llm 서비스를 NVIDIA GPU 로 돌린다. 앞의 compose.yaml 위에 겹쳐 쓴다:
#   docker compose -f infra/local/compose.yaml -f infra/local/compose.gpu.yaml --env-file infra/local/.env --profile llm up -d
# 필요: NVIDIA 드라이버 + (Windows) Docker Desktop WSL2 GPU 지원 / (Linux) NVIDIA Container Toolkit.
# GTX 1080 급(Pascal, VRAM 8GB)은 7B 4bit 까지, 4GB 는 3B 4bit 까지 [TO VERIFY — 이 이미지가 해당 GPU 구조를 포함하는지 첫 실행에서 확인].
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: ["-hf", "${CERA_LLM_HF:-Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M}", "--host", "0.0.0.0", "--port", "8080", "-c", "${CERA_LLM_CTX:-4096}", "--parallel", "1", "-ngl", "99"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
