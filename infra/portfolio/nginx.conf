# CERA 공개 포트폴리오 화면 서버(T-131) — front/web/Dockerfile 의 nginx 에 compose 가 이 파일을 붙인다(로컬용 front/web/nginx.conf 대신).
# 앞단 Caddy(HTTPS) → 여기 → api:3100. 화면 정적 파일 + /backend/* 프록시 + 보안 헤더 + 방문자 IP 별 요청 속도 제한.

# 방문자 IP = Caddy 가 붙인 X-Forwarded-For. Caddy 는 방문자가 보낸 X-Forwarded-For 를 믿지 않고 실제 접속 주소로 다시 쓴다(신뢰 프록시 미설정).
# 이 nginx 에 닿는 것은 같은 Docker 망의 Caddy 뿐이라 출처 범위를 좁히지 않는다
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# 초당 요청 수 제한(방문자 IP 별) [ASSUMPTION] — 폭주(flood)만 끊는 바깥 울타리. 화면 새로고침 한 번에 목록 요청 20여 개가 몰리므로
# 여유를 크게 둔다(10r/s · burst 40 은 E2E 에서 정상 사용을 429 로 막았다). 업무 한도(데모 세션 · Agent · 재계산 · 답장)는 Backend 가 따로 센다
limit_req_zone $binary_remote_addr zone=cera_api:10m rate=30r/s;
limit_req_status 429;

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  # 업로드 · JSON 본문 상한(Backend 기본 100 KB 보다 크게 받을 일이 없다)
  client_max_body_size 256k;

  # 모든 응답에 붙는 보안 헤더 — location 에 add_header 가 있으면 상속되지 않으므로 include 로 같은 줄을 반복한다
  include /etc/nginx/conf.d/security-headers.inc;

  # Agent Runtime 전용 내부 경로는 인터넷에서 닫는다(서비스 토큰이 있어도 바깥에서는 부를 이유가 없다)
  location ^~ /backend/internal/ {
    return 404;
  }

  location /backend/ {
    limit_req zone=cera_api burst=120 nodelay;
    resolver 127.0.0.11 valid=10s;
    set $cera_api http://api:3100;
    rewrite ^/backend/(.*)$ /$1 break;
    proxy_pass $cera_api;
    proxy_set_header Host $host;
    # 방문자 IP 하나만 넘긴다(API 는 CERA_TRUST_PROXY_HOPS=1 로 이 값을 쓴다 — 방문자가 헤더를 꾸며도 Caddy 가 이미 덮어썼다)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    # Backend 오류 페이지가 아니라 Backend 의 JSON 오류(code · message · request_id)를 그대로 넘긴다
    proxy_intercept_errors off;
  }

  # 소스맵은 배포하지 않는다(빌드 기본값이 만들지 않지만 혹시 있어도 내주지 않는다)
  location ~* \.map$ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-store" always;
  }
}
