[project]
name = "cera-ai"
version = "0.1.0"
description = "CERA AI Server — reply extraction candidates and the agent tool client (no DB, no channels, no public APIs; ADR-033 · ADR-036)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
