# CERA Control Tower 정적 서버 (front/web/Dockerfile 이 사용). 호스트 개발의 Vite 프록시와 같은 일을 한다(vite.config.ts).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /backend/* → Main Backend. 접두사 /backend 를 떼고 넘긴다. 이름 해석을 요청 때 하므로 api 가 아직 없어도 nginx 는 뜬다(화면은 Mock 으로 동작).
  location /backend/ {
    resolver 127.0.0.11 valid=10s;
    set $cera_api http://api:3100;
    rewrite ^/backend/(.*)$ /$1 break;
    proxy_pass $cera_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # SPA: 모르는 경로는 index.html (클라이언트 라우팅)
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
